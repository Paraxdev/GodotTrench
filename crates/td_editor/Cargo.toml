[package]
name = "td_editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "trenchdot"
path = "src/main.rs"

[dependencies]
td_core.workspace = true
td_geom.workspace = true
td_doc.workspace = true
td_formats.workspace = true
td_render.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
base64.workspace = true
imbl.workspace = true
gltf.workspace = true
tobj = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest = "0.36"
td_core.workspace = true
# Same format eframe's storage writes, JSON cannot hold the infinite rects in a dock layout.
ron = "0.12"
