# The docs site, built by Zensical from docs/. Run `zensical serve` or `zensical build` from this folder, see
# docs/development.md#documentation.

[project]
site_name = "TrenchDot"
site_description = "A brush based level editor for Godot"
site_url = "https://paraxdev.github.io/TrenchDot/"
repo_url = "https://github.com/Paraxdev/TrenchDot"
repo_name = "Paraxdev/TrenchDot"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "_site"
# The editor's help links, the welcome screen and the addon README point at page.html URLs.
use_directory_urls = false
# SUMMARY.md is still read as the nav, it is only kept out of the published pages.
exclude_docs = """
SUMMARY.md
requirements.txt
overrides/
/translations/
"""
extra_css = ["stylesheets/td.css"]
extra_javascript = ["javascripts/td.js"]

[project.extra]
mcp_switch = "Show the parts of these docs about driving the editor over MCP, for AI agents and scripts"

# One entry per language, the language button of every build lists them. The folder after /TrenchDot/ is the editor's
# language code, the last value is the hreflang. tools/build_site.py builds each language into that folder.
[[project.extra.alternate]]
name = "English"
link = "/TrenchDot/"
lang = "en"

[[project.extra.alternate]]
name = "Deutsch"
link = "/TrenchDot/de/"
lang = "de"

[[project.extra.alternate]]
name = "Français"
link = "/TrenchDot/fr/"
lang = "fr"

[[project.extra.alternate]]
name = "Español"
link = "/TrenchDot/es/"
lang = "es"

[[project.extra.alternate]]
name = "Português"
link = "/TrenchDot/pt/"
lang = "pt-BR"

[[project.extra.alternate]]
name = "Русский"
link = "/TrenchDot/ru/"
lang = "ru"

[[project.extra.alternate]]
name = "简体中文"
link = "/TrenchDot/zh-Hans/"
lang = "zh-Hans"

[[project.extra.alternate]]
name = "日本語"
link = "/TrenchDot/ja/"
lang = "ja"

[project.theme]
custom_dir = "docs/overrides"
language = "en"
logo = "assets/logo.png"
favicon = "assets/logo.png"
# System fonts, so pages load nothing from Google Fonts.
font = false
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Setting markdown_extensions replaces Zensical's default set, so everything the pages use is listed.
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.quotes.callouts = true
pymdownx.superfences = {}

[project.plugins.literate-nav]
nav_file = "SUMMARY.md"
