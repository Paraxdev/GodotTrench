name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/check_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/check_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment, cancelling older in progress runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Zensical
        run: pip install -r docs/requirements.txt

      - name: Build the site
        # --strict fails on links to pages or headings that do not exist. The output lands in _site.
        run: zensical build --clean --strict

      - name: Check links in the site
        # What --strict lets through: a mistyped page in SUMMARY.md, a missing image, a page left out of the nav.
        run: python tools/check_site.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically on the first run, so no manual repo setting is needed.
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
