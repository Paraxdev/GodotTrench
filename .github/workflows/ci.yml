name: CI

on:
  push:
    branches: [main]
    # The docs have their own build and deploy workflow (pages.yml). Without this, a docs only
    # commit runs the full Rust/E2E/Godot suite, replaces the rolling beta release, and pushes to itch.
    paths-ignore:
      - "docs/**"
      - ".gitbook.yaml"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: 4.7.2
  RUST_TOOLCHAIN: 1.98.1 # keep in step with rust-toolchain.toml
  LINUX_DEPS: >-
    libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor1 libxrandr2 libxi6
    libvulkan1 mesa-vulkan-drivers xvfb

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Format
        if: runner.os == 'Linux'
        run: ./tools/fmt --check
      - name: Third party license table is current
        if: runner.os == 'Linux'
        run: python3 tools/gen_licenses.py --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit, fixtures, headless UI panels)
        run: cargo test --workspace

  e2e:
    name: Editor end to end (Linux, software Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-release
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: End to end tests
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test --release -p gt_editor --test e2e -- --ignored --test-threads=1
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: target/e2e/*.png
          if-no-files-found: ignore

  godot:
    name: Godot addon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        # With an empty cache the first pass only registers script classes.
        run: |
          "$GODOT" --headless --path godot --import || true
          "$GODOT" --headless --path godot --import
      - name: Addon tests
        run: |
          "$GODOT" --headless --path godot --script res://tests/run_tests.gd
      - name: Build showcase scenes
        run: |
          "$GODOT" --headless --path godot --script res://tests/build_showcase.gd

  package:
    name: Package (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, e2e, godot]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            exe: godottrench
          - name: windows-x86_64
            os: windows-latest
            exe: godottrench.exe
          - name: macos-arm64
            os: macos-latest
            exe: godottrench
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Build editor
        # GodotTrench ships only as the rolling beta, so the editor takes its downloads from there.
        env:
          GODOTTRENCH_CHANNEL: beta
        run: cargo build --release -p gt_editor
      - name: Package
        shell: bash
        run: |
          dir="godottrench-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp "target/release/${{ matrix.exe }}" "dist/$dir/"
          cp README.md LICENSE LICENSES.md "dist/$dir/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -bd "$dir.zip" "$dir" > /dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
          rm -rf "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: editor-*
          merge-multiple: true
      - name: Package Godot addon, demo project and content
        run: |
          # The addon is a submodule, its .git file and git settings stay out of the zips.
          (cd godot && zip -qr "../dist/func_godot-godottrench-addon.zip" addons/func_godot -x "addons/func_godot/.git*")
          zip -qr dist/godottrench-demo-project.zip godot -x "godot/.godot/*" "godot/addons/func_godot/.git*"
          # What the editor's content wizard downloads into a project, laid out as in the project. The folders must be the
          # ones crates/gt_editor/src/content.rs accepts, its tests read these two lines.
          (cd godot && zip -qr "../dist/godottrench-nature-pack.zip" godottrench/nature -x "*.import")
          (cd godot && zip -qr "../dist/godottrench-demo-content.zip" demo models)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls dist | grep -qiE '\.(png|jpe?g|gif|webp)$'; then
            echo "images belong in the release notes, not in the downloads"
            exit 1
          fi
          shots="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/docs/screenshots"
          downloads="* godottrench-*: the editor for Linux, Windows and macOS.
          * func_godot-godottrench-addon.zip: the Godot addon. The editor installs it into a project from its setup window, or extract it into your Godot project so it becomes res://addons/func_godot.
          * godottrench-demo-project.zip: the demo Godot project with the showcase maps.
          * godottrench-nature-pack.zip and godottrench-demo-content.zip: the nature models and the demo content that the editor's Godot > Add Content to Project adds to a project, no need to download them by hand.

          The same files are on itch.io at https://paraxdev.itch.io/godottrench, the editor itself only downloads from these GitHub releases.

          ![Editor](${shots}/editor.png)
          ![Lighthouse and Forest in Godot](${shots}/lighthouse_forest.png)
          ![Church and School in Godot](${shots}/church_school.png)
          ![Mountain Hanging House in Godot](${shots}/mountain_house.png)"
          # GitHub refuses the workflow token a tag on an older commit whose workflow files differ from main, and a newer run
          # publishes anyway. A newer docs only commit starts no run, so only step aside when the workflows changed.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            git fetch -q --depth=1 origin "$head"
            if ! git diff --quiet "$GITHUB_SHA" "$head" -- .github/workflows; then
              echo "main moved on to ${head::7} with new workflows, leaving the beta to that run"
              exit 0
            fi
          fi
          notes="Rolling beta built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). It passed every test, but may still have rough edges.

          ${downloads}"
          # GodotTrench ships only as the rolling beta, so any other release, like the old v0.1.0, goes with its tag.
          gh release list --json tagName --jq '.[].tagName' | grep -vx beta | xargs -r -I{} gh release delete {} --yes --cleanup-tag
          gh release delete beta --yes --cleanup-tag || true
          gh release create beta dist/* --prerelease --target "$GITHUB_SHA" --title "GodotTrench rolling beta" --notes "$notes"
      - name: Push to itch.io
        # Skips cleanly on forks and until the BUTLER_API_KEY secret is added.
        if: ${{ env.BUTLER_API_KEY != '' }}
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler-bin && chmod +x butler-bin/butler
          butler=butler-bin/butler
          "$butler" -V
          # The rolling beta is the only build, so it fills the plain channels.
          version="beta-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          push() {
            archive="$1"; channel="$2"; out="itch/$channel"
            rm -rf "$out" && mkdir -p "$out"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$out" ;;
              *.tar.gz) tar xzf "$archive" -C "$out" ;;
            esac
            # butler wants the build root, so drop the single wrapping folder the archives carry.
            inner=$(find "$out" -mindepth 1 -maxdepth 1 -type d | head -n1)
            [ -n "$inner" ] && out="$inner"
            "$butler" push "$out" "paraxdev/godottrench:$channel" --userversion "$version"
          }
          push dist/godottrench-linux-x86_64.tar.gz linux
          push dist/godottrench-windows-x86_64.zip windows
          push dist/godottrench-macos-arm64.tar.gz mac
          # The addon, demo project and content ship as their own zips so their folder layout (addons/func_godot, the
          # project, godottrench/nature, demo and models) survives.
          "$butler" push dist/func_godot-godottrench-addon.zip "paraxdev/godottrench:addon" --userversion "$version"
          "$butler" push dist/godottrench-demo-project.zip "paraxdev/godottrench:demo-project" --userversion "$version"
          "$butler" push dist/godottrench-nature-pack.zip "paraxdev/godottrench:nature-pack" --userversion "$version"
          "$butler" push dist/godottrench-demo-content.zip "paraxdev/godottrench:demo-content" --userversion "$version"
