{% extends "base.html" %}

{% block extrahead %}
  {% set image = config.site_url ~ "assets/brand/meta-og-1200x630.png" %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title ~ ' - ' ~ config.site_name if page and page.title and page.url not in ['', 'index.html'] else config.site_name }}">
  <meta property="og:description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}">
  <meta property="og:image" content="{{ image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ image }}">
{% endblock %}
